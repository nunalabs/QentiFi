[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

# Formatter
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"

# Tests
[fuzz]
runs = 256
max_test_rejects = 65536
seed = '0x1'
dictionary_weight = 40
include_storage = true
include_push_bytes = true

[invariant]
runs = 256
depth = 15
fail_on_revert = false

# RPC endpoints
[rpc_endpoints]
ande_testnet = "${ANDE_TESTNET_RPC}"
ande_mainnet = "${ANDE_MAINNET_RPC}"
localhost = "http://localhost:8545"

# Etherscan API
[etherscan]
ande_testnet = { key = "${ANDESCAN_API_KEY}" }
ande_mainnet = { key = "${ANDESCAN_API_KEY}" }

# Gas reports
[gas_reports]
"*" = true

# Coverage
[coverage]
exclude = ["test/**", "script/**"]
